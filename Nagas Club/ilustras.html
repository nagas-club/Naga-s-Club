<style>

*{

}


body{

}


/* =========================
   HEADER
   ========================= */

header img{
	width:100%;
	display:block;
}


/* =========================
   MENU
   ========================= */

nav{
	width:100%;
	background:#333;
	margin-top:10px;
	position:relative;
	z-index:1000;
}


nav ul{
	list-style:none;
	display:flex;
}


nav ul li{
	position:relative;
}


nav ul li a{
	display:block;
	padding:14px 20px;
	color:white;
	text-decoration:none;
	font-family:Montserrat;
}


nav ul li a:hover{
	background:#111;
}


/* =========================
   SUBMENU
   ========================= */

.dropdown-content{
	display:none;
	position:absolute;
	background:#333;
	min-width:160px;
	top:100%;
	left:0;
}


.dropdown-content a{
	padding:12px 16px;
	display:block;
	color:white;
}


.dropdown-content a:hover{
	background:#111;
}


.dropdown:hover .dropdown-content{
	display:block;
}


/* =========================
   GALERIA
   ========================= */

.galeria{
	margin-top:40px;
	display:grid;
	grid-template-columns:repeat(4,1fr);
	gap:30px;
}


.artes{
	position:relative;
	width:100%;
	aspect-ratio:1/1;
	overflow:hidden;
	cursor:pointer;
}


.artes img{
	width:100%;
	height:100%;
	object-fit:cover;
	display:block;
	transition:transform 0.4s;
}


.artes:hover img{

	filter:brightness(70%);
}

   MODAL
   ========================= */

.modal-obra{

	height:100%;

.modal-imagem img{

	max-height:80vh;

	width:auto;

	height:auto;

	display:block;

}

}


.modal-info p{

	color:white;

	padding:0;

}

.fechar{

}

<script>

/* =========================
   ABRIR OBRA
   ========================= */

function abrirObra(imagem, titulo, descricao){

	document.getElementById("imagemModal").src = imagem;

	document.getElementById("imagemModal").alt = titulo;

	document.getElementById("tituloModal").innerText = titulo;

	document.getElementById("textoModal").innerText = descricao;

	document.getElementById("modalObra").style.display = "flex";

	document.body.style.overflow = "hidden";

}


/* =========================
   FECHAR OBRA
   ========================= */

function fecharObra(){

	document.getElementById("modalObra").style.display = "none";

	document.body.style.overflow = "auto";

}


/* =========================
   FECHAR CLICANDO FORA
   ========================= */

function fecharFora(event){

	if(event.target === document.getElementById("modalObra")){

		fecharObra();

	}

}


/* =========================
   FECHAR COM ESC
   ========================= */

document.addEventListener("keydown", function(event){

	if(event.key === "Escape"){

		fecharObra();

	}

});

</script>
