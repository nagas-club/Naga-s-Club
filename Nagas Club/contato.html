<!DOCTYPE html>

<head>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<style>

*{
	box-sizing:border-box;
	padding:0;
	margin:0;
}

h2{
	text-align:center;
	font-size:40px;
	color:white;
	background:#891c33;
	font-family:verdana;
	padding:10px;
}

p{
	font-family:Montserrat;
	padding-left:20px;
	padding-right:20px;
	padding-top:10px;
	color:white;
}

body{
	margin-left:5%;
	margin-right:5%;
}

header img{
	width:100%;
	display:block;
}

/* MENU */

nav{
	width:100%;
	background:#333;
	margin-top:10px;
	position:relative;
	z-index:1000;
}

nav ul{
	list-style:none;
	display:flex;
}

nav ul li{
	position:relative;
}

nav ul li a{
	display:block;
	padding:14px 20px;
	color:white;
	text-decoration:none;
	font-family:Montserrat;
}

nav ul li a:hover{
	background:#111;
}

/* SUBMENU */

.dropdown-content{
	display:none;
	position:absolute;
	background:#333;
	min-width:160px;
	top:100%;
	left:0;
}

.dropdown-content a{
	padding:12px 16px;
	display:block;
	color:white;
}

.dropdown-content a:hover{
	background:#111;
}

.dropdown:hover .dropdown-content{
	display:block;
}


/* CONTATO */

.contato{
	width:100%;
	margin-top:40px;
	background:#aa6a85;
	padding:30px;
	overflow:hidden;
}

.redes{
	text-align:center;
	margin-bottom:30px;
}

.redes img{
	width:40px;
	margin:10px;
	transition:0.3s;
}

.redes img:hover{
	transform:scale(1.1);
}

.formulario{
	width:60%;
	margin:auto;
}

.formulario input,
.formulario textarea{
	width:100%;
	padding:10px;
	margin-top:10px;
	border:none;
	border-radius:4px;
	font-family:Montserrat;
}

.formulario button{
	margin-top:15px;
	padding:10px 20px;
	background:#891c33;
	color:white;
	border:none;
	font-family:Montserrat;
}

.formulario button:hover{
	background:#5e1223;
}


/* FOOTER */

footer{
	background:#891c33;
	color:white;
	text-align:center;
	padding:15px;
	font-family:Montserrat;
	margin-top:40px;
}


/* =========================================
   CELULAR
   ========================================= */

@media (max-width:768px){

	/* ESPAÇAMENTO DA PÁGINA */

	body{
		margin-left:3%;
		margin-right:3%;
	}

	/* BANNER */

	header img{
		width:100%;
		height:auto;
	}

	/* MENU VERTICAL */

	nav{
		margin-top:8px;
	}

	nav ul{
		display:flex;
		flex-direction:column;
		width:100%;
	}

	nav ul li{
		width:100%;
	}

	nav ul li a{
		width:100%;
		text-align:center;
		padding:12px 10px;
		font-size:13px;
	}

	/* SUBMENU */

	.dropdown-content{
		position:static;
		width:100%;
		min-width:0;
	}

	.dropdown-content a{
		padding:10px;
		font-size:12px;
		text-align:center;
	}


	/* CONTATO */

	.contato{
		width:100%;
		margin-top:25px;
		padding:15px;
	}

	/* TÍTULO */

	h2{
		font-size:28px;
		padding:10px 5px;
	}

	/* TEXTO */

	.contato > p{
		font-size:13px;
		line-height:1.5;
		padding-left:5px;
		padding-right:5px;
		text-align:center;
	}

	/* REDES SOCIAIS */

	.redes{
		margin-top:20px;
		margin-bottom:25px;
		display:flex;
		justify-content:center;
		align-items:center;
		flex-wrap:wrap;
	}

	.redes img{
		width:38px;
		margin:7px;
	}

	/* FORMULÁRIO */

	.formulario{
		width:100%;
		margin:auto;
	}

	.formulario input,
	.formulario textarea{
		width:100%;
		padding:12px;
		margin-top:10px;
		font-size:16px;
	}

	.formulario textarea{
		min-height:120px;
		resize:vertical;
	}

	/* BOTÃO */

	.formulario button{
		width:100%;
		padding:13px;
		margin-top:15px;
		font-size:15px;
	}

	/* FOOTER */

	footer{
		margin-top:25px;
		padding:12px 8px;
		font-size:11px;
		line-height:1.4;
	}

}

</style>
